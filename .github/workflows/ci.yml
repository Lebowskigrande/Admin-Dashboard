name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - new-db-schema

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm run test:quick

      - name: API contract check
        run: npm run check:contracts:strict

      - name: Route/navigation smoke check
        run: npm run smoke:routes:strict
